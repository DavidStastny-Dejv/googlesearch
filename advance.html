<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokročilé vyhledávání Google</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .advance-container {
            width: 80%;
            max-width: 800px;
            text-align: left;
            margin: 20px auto;
            padding: 20px;
        }
        .advance-title {
            color: #d93025;
            font-size: 20px;
            border-bottom: 1px solid #dadce0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .advance-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .advance-row label {
            width: 300px;
            font-size: 13px;
            color: #222;
        }
        .advance-row input {
            flex: 1;
            height: 30px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .advance-submit {
            text-align: right;
            margin-top: 20px;
        }
        .advance-submit input {
            background-color: #4d90fe;
            color: white;
            border: none;
            padding: 6px 15px;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Zpět na Google</a>
        </nav>
    </header>

    <div class="advance-container">
        <div class="advance-title">Pokročilé vyhledávání</div>
        <form action="https://google.com/search" method="GET">
            <div class="advance-row">
                <label>Hledat stránky, které obsahují:</label>
                <input type="text" name="as_q">
            </div>
            <div class="advance-row">
                <label>Přesné slovo nebo frázi:</label>
                <input type="text" name="as_epq">
            </div>
            <div class="advance-row">
                <label>Libovolné z těchto slov:</label>
                <input type="text" name="as_oq">
            </div>
            <div class="advance-row">
                <label>Žádné z těchto slov:</label>
                <input type="text" name="as_eq">
            </div>
            <div class="advance-submit">
                <input type="submit" value="Pokročilé vyhledávání">
            </div>
        </form>
    </div>

    <footer>
        <div><span>Česko</span></div>
        <div>
           <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2FDavidStastny-Dejv.github.io%2Fgooglesearch%2Fadvance.html" target="_blank">Validovat HTML</a>
           <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2FDavidStastny-Dejv.github.io%2Fgooglesearch%2Fstyle.css" target="_blank">Validovat CSS</a>
            <a href="https://github.com/DavidStastny-Dejv/googlesearch/blob/main/citace.md" target="_blank">Citace a zdroje</a>
            <a href="https://davidstastny-dejv.github.io/web-1/" target="_blank">Moje portfolio</a>
        </div>
    </footer>
</body>
</html>
